name: Deploy to QA

# CD para QA: automatico a cada push na branch `qa`. Sem aprovacao
# manual - QA existe justamente pra testar rapido e com risco baixo.
on:
  push:
    branches: [qa]

permissions:
  contents: read
  packages: write  # necessario pra publicar no GHCR usando o GITHUB_TOKEN

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name (exigencia do GHCR)
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:qa
            ${{ env.IMAGE }}:qa-${{ github.sha }}
