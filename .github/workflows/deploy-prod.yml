name: Deploy to Production

# CD para producao: automatico a cada push na branch `main`, mas o
# job so roda de fato depois de aprovacao manual no environment
# "production" (configurado em Settings > Environments no GitHub).
# Isso e o "gate" que separa deploy continuo (QA) de entrega continua
# com controle humano (producao).
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name (exigencia do GHCR)
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:prod-${{ github.sha }}
