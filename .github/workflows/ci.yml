name: CI

# CI = validar toda mudanca antes de qualquer deploy. Roda em PRs e em
# push para as branches que alimentam os ambientes (qa, main), mas
# nunca publica nada - so falha rapido se algo quebrou.
on:
  pull_request:
  push:
    branches: [main, qa]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt

      - run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # so builda a imagem pra confirmar que o Dockerfile funciona;
      # push=false -> nao publica nada em lugar nenhum
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: slides-automation:ci-check
